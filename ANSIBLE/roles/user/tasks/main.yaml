- name: disable nodejs
  ansible.builtin.command: dnf module disable nodejs -y

- name: enable nodejs
  ansible.builtin.command: dnf module enable nodejs:20 -y

- name: install nodejs
  ansible.builtin.package:
    name: nodejs
    state: present

- name: create system user
  ansible.builtin.user:
    name: roboshop
    state: present
    system: true
    comment: "system user"
    home: /app
    shell: /sbin/nologin

- name: delete /app dir
  ansible.builtin.file:
    path: /app
    state: absent

- name: craete dir
  ansible.builtin.file:
    path: /app
    state: directory
    owner: roboshop
    group: roboshop

- name: delete old code file
  ansible.builtin.file:
    path: /tmp/user.zip
    state: absent

- name: downlaod code
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
    dest: /tmp/user.zip

- name: unzip code
  ansible.builtin.unarchive:
    src: /tmp/user.zip
    dest: /app
    remote_src: yes
    owner: roboshop
    group: roboshop

- name: install dependencies
  community.general.npm:
    path: /app
    state: present

- name: copy user.service
  ansible.builtin.copy:
    src: user.service
    dest: /etc/systemd/system/user.service

- name: start and enable
  ansible.builtin.systemd_service:
    name: user.service
    state: started
    enabled: yes
    daemon_reload: true