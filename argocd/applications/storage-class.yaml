apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-class
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: roboshop
  source:
    repoURL: https://github.com/meghashyam-singh/27-8.git
    targetRevision: main
    path: storage-class
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true                    # Delete resources removed from git
      selfHeal: true 